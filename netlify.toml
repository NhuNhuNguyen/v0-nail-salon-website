[build]
  command = "npm run build"
  publish = ".next"

[functions]
  node_bundler = "pnpm"
  # Increase timeout from default 10s to 60s for email sending
  timeout = 60

# Redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Cache rules for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.{js,css,woff,woff2}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
